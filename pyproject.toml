[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sculpture"
version = "0.1.0"
description = "Automatic design of floating anamorphic assembly sculptures (three competing optimizers)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",          # HiGHS LP/MILP (linprog / milp), distance transforms, KD-trees
    "scikit-image>=0.22",   # spatial/color superpixels for image-guided proposals
    "torch>=2.1",
    "trimesh>=4.0",
    "assimp-py>=1.1",
    "fast-simplification>=0.1",
    "pillow>=9",
    "pyyaml>=6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
]
# nvdiffrast is installed separately (see README): pip install git+https://github.com/NVlabs/nvdiffrast

[project.optional-dependencies]
gurobi = ["gurobipy"]
dev = ["pytest>=7", "httpx"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: longer optimization smoke tests"]
